name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Check server package boundaries
        run: node --test scripts/package-server.test.mjs
      - name: Run desktop updater unit tests
        run: npm run test:desktop-updater
      - name: Run server tests
        run: npm run test:server
      - name: Run client tests
        run: npm run test:client
      - name: Build client
        run: npm run build
      - name: Check bundle
        run: npm run check:bundle
      - name: Audit production dependencies
        run: |
          npm run audit:prod
          npm audit --prefix desktop --omit=dev --registry=https://registry.npmjs.org
