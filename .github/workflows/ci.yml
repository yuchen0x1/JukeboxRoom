name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Verify platform version metadata
        run: node scripts/check-versions.mjs
      - name: Check server package boundaries
        run: node --test scripts/package-server.test.mjs
      - name: Check mobile configuration
        run: node --test client/scripts/capacitor-config.test.mjs
      - name: Run desktop updater unit tests
        run: npm run test:desktop-updater
      - name: Check server test isolation
        run: npm run test:server-isolation
      - name: Run server tests
        run: npm run test:server
      - name: Run client tests
        run: npm run test:client
      - name: Build client
        run: npm run build
      - name: Check bundle
        run: npm run check:bundle
      - name: Audit production dependencies
        run: |
          npm run audit:prod
          npm audit --prefix desktop --omit=dev --registry=https://registry.npmjs.org

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Docker image
        run: docker build --tag jukeboxroom:ci .
      - name: Check container routes and restart
        run: |
          docker run --detach --name jukeboxroom-ci --publish 127.0.0.1:4000:4000 \
            --env CLIENT_ID_SECRET=ci-only-client-id-secret-1111111111 \
            --env AUTH_JWT_SECRET=ci-only-auth-jwt-secret-2222222222 \
            --env CLIENT_URL=http://127.0.0.1:4000 jukeboxroom:ci
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:4000/api/health/ready
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4000/
          docker restart jukeboxroom-ci
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:4000/api/health/ready
      - name: Print container logs on failure
        if: failure()
        run: |
          if docker container inspect jukeboxroom-ci >/dev/null 2>&1; then
            docker logs jukeboxroom-ci
          fi
