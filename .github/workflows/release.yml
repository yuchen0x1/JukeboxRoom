name: Publish verified release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'yuchen0x1/JukeboxRoom' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify version and main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-versions.mjs "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --prefix desktop
      - name: Test and audit
        run: |
          npm run test:all
          node --test scripts/package-server.test.mjs client/scripts/capacitor-config.test.mjs
          npm run audit:prod
          npm audit --prefix desktop --omit=dev --registry=https://registry.npmjs.org

  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix client
      - name: Build web and self-hosted archive
        run: |
          npm run package:build
          npm run check:bundle
          mkdir -p release/assets
          mv release/openmusic-build.zip "release/assets/jukeboxroom-server-${GITHUB_REF_NAME#v}.zip"
          tar -C client/dist -czf "release/assets/jukeboxroom-web-${GITHUB_REF_NAME#v}.tar.gz" .
      - name: Smoke-test extracted server archive
        run: |
          unzip -q release/assets/jukeboxroom-server-*.zip -d "$RUNNER_TEMP/jukeboxroom"
          npm ci --prefix "$RUNNER_TEMP/jukeboxroom/server" --omit=dev
          PORT=4000 OPENMUSIC_DATA_DIR="$RUNNER_TEMP/jukeboxroom-data" AUTO_UPDATE=0 \
            node "$RUNNER_TEMP/jukeboxroom/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4000/api/health/ready
          OPENMUSIC_SKIP_UPDATE=1 npm run check:health
          curl --fail --silent --show-error http://127.0.0.1:4000/sw.js | node --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-web
          path: release/assets/
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix client
      - run: npm ci --prefix desktop
      - run: npm run build
      - name: Build Windows x64 and verify signatures when configured
        id: build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $signed = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          if ($signed) {
            npm run dist --prefix desktop -- --publish never -c.forceCodeSigning=true -c.extraMetadata.jukeboxroomSignedUpdates=true
            if ($LASTEXITCODE -ne 0) { throw 'Signed Windows packaging failed' }
            $installer = Get-Item "release/desktop/jukeboxroom-desktop-setup-$($env:GITHUB_REF_NAME.Substring(1))-x64.exe"
            foreach ($file in @($installer.FullName, 'release/desktop/win-unpacked/JukeboxRoom.exe')) {
              if ((Get-AuthenticodeSignature -FilePath $file).Status -ne 'Valid') {
                throw "Invalid Authenticode signature for $file"
              }
            }
            $config = Get-Content 'release/desktop/win-unpacked/resources/app-update.yml' -Raw
            if ($config -notmatch '(?m)^publisherName:\s*(?:\r?\n\s*-)?.+\S') {
              throw 'Missing update publisher identity'
            }
          } else {
            npm run dist --prefix desktop -- --publish never -c.win.signExecutable=false
            if ($LASTEXITCODE -ne 0) { throw 'Windows preview packaging failed' }
          }
          node desktop/scripts/write-checksums.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify Windows asset set' }
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.signed == 'true' && 'release-windows' || 'preview-windows-unsigned' }}
          path: |
            release/desktop/jukeboxroom-desktop-setup-*.exe
            release/desktop/jukeboxroom-desktop-setup-*.blockmap
            release/desktop/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [web, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-web
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.windows.outputs.signed == 'true'
        with:
          name: release-windows
          path: assets
      - name: Select release notes
        id: notes
        run: node .github/scripts/select-release-notes.mjs
      - name: Create draft and verify uploaded asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.path }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This tag already has a release. Inspect it before retrying."
            exit 1
          fi
          if [ -z "$RELEASE_NOTES" ]; then
            echo "::error::Versioned release notes are required"
            exit 1
          fi
          if [ "$WINDOWS_SIGNED" = true ]; then
            printf '\nWindows x64 附带已验证 Authenticode 签名的安装包和更新元数据。\n' >> "$RELEASE_NOTES"
          else
            printf '\nWindows x64 未配置签名，本次构建仅保留在 Actions。\n' >> "$RELEASE_NOTES"
          fi
          (cd assets && sha256sum -- * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.digest)"' > "$RUNNER_TEMP/release-digests"
          for file in assets/*; do
            grep -Fx "$(basename "$file") sha256:$(sha256sum "$file" | cut -d ' ' -f 1)" "$RUNNER_TEMP/release-digests"
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
