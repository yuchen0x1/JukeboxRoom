name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'yuchen0x1/JukeboxRoom'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            desktop/package-lock.json

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit reachable from origin/main.' }
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $versions = @(
            (Get-Content package.json -Raw | ConvertFrom-Json).version,
            (Get-Content client/package.json -Raw | ConvertFrom-Json).version,
            (Get-Content server/package.json -Raw | ConvertFrom-Json).version,
            (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          )
          if (($versions | Where-Object { $_ -ne $tagVersion }).Count -gt 0) {
            throw "Tag v$tagVersion does not match package versions: $($versions -join ', ')"
          }

      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/yuchen0x1/JukeboxRoom/releases/tags/$env:GITHUB_REF_NAME"
          try {
            Invoke-RestMethod -Uri $uri -Headers $headers | Out-Null
            throw "Release $env:GITHUB_REF_NAME already exists; refusing to overwrite it."
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Run tests
        run: |
          npm run test:desktop-updater
          npm run test:server
          npm run test:client
      - name: Build client
        run: |
          node scripts/gen-desktop-icon.mjs
          npm run build
      - name: Check bundle
        run: npm run check:bundle
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit desktop updater dependencies
        run: npm audit --prefix desktop --omit=dev --registry=https://registry.npmjs.org
      - name: Build Windows installer and update metadata
        run: npm run dist --prefix desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Generate SHA-256 manifest
        run: node desktop/scripts/write-checksums.cjs

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES_CN.md
          fail_on_unmatched_files: true
          files: |
            release/desktop/jukeboxroom-desktop-setup-*.exe
            release/desktop/jukeboxroom-desktop-setup-*.blockmap
            release/desktop/latest*.yml
            release/desktop/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
