# JukeboxRoom · 多人实时在线点歌系统
#
# 最小启动：   docker compose up -d --build
# 带持久化：   下方 volumes 已把房间数据挂载到宿主机 ./data
#
# 生产必改：environment 里的 CLIENT_ID_SECRET（换成任意长随机串）

services:
  jukeboxroom:
    build: .
    container_name: jukeboxroom
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      # 生产必改：随机长字符串，用于签名浏览器会话
      CLIENT_ID_SECRET: please-change-this-to-a-long-random-string
      # 音乐源（免费默认源，可自行替换为自建 Meting）
      METING_API_URL: https://api.injahow.cn/meting
      METING_SEARCH_API_URL: https://api.i-meto.com/meting/api
      # 可选：Gitee 私人令牌，让更新检查走认证通道（避免匿名限流）
      # UPDATE_GITEE_TOKEN: gitee-personal-token
      # 可选：Redis 持久化（房间/收藏重启不丢）
      # REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/server/data
    # 如需 Redis，取消下面注释并同时启用 REDIS_URL
    # depends_on:
    #   - redis

  # 可选：Redis 持久化（房间、收藏、热榜重启不丢）
  # redis:
  #   image: redis:7-alpine
  #   container_name: jukeboxroom-redis
  #   restart: unless-stopped
  #   volumes:
  #     - ./redis-data:/data
